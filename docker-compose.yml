version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-localhost:3001}
    restart: always

  signaling:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist-server/ws-server.js
    expose:
      - "3001"
    environment:
      - PORT=3001
    restart: always
