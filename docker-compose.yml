version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_WS_URL=localhost:3001
    restart: always

  signaling:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist-server/ws-server.js
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: always
